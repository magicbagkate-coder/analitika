services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
    ports:
      - "3000:3000"
    # Google service-account key for the spreadsheet export — kept outside the repo, mounted read-only.
    volumes:
      - ${GOOGLE_SECRETS_DIR:-/home/cloud/secrets}:/run/secrets/google:ro
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

# Named volume — survives `docker compose down` (no -v) and `docker rm` of the containers,
# so removing/recreating the containers never loses the DB's physical data.
volumes:
  postgres_data:
    name: magicbag_postgres_data
